<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05060A"><title>入门定级 | 未尽 UNFINISHED</title><link rel="stylesheet" href="assets/fonts/fonts.css?v=3c31534e" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="assets/fonts/fonts.css?v=3c31534e"></noscript><link rel="stylesheet" href="styles.css?v=5831a22b"><link rel="stylesheet" href="market.css?v=384c952a"><link rel="stylesheet" href="study.css?v=1ab1b395"><link rel="stylesheet" href="assets/practice/practice.css?v=e988665b"><link rel="stylesheet" href="folio-theme.css?v=82b6e945"><link rel="stylesheet" href="d-theme.css?v=4df0488d"><link rel="stylesheet" href="assets/extras/extras.css?v=3e138ec1"><!-- ai-island:start --><script src="assets/i18n/i18n.js?v=ac7c806e"></script><link rel="stylesheet" href="assets/ai/ai-island.css?v=d696a194"><link rel="stylesheet" href="assets/companion/companion.css?v=846437d8"><!-- ai-island:end --></head><body class="market-body extras-body"><a class="skip" href="#extras-main">跳到正文</a><header class="folio-header night-nav"><a class="folio-brand" href="index.html" aria-label="未尽 UNFINISHED 首页"><b>未尽</b></a><nav aria-label="主导航"><a href="technical.html" >市场</a><a href="web3.html" >Web3</a><a href="study.html#routes" >学习路线</a><a href="assessment.html" aria-current="page">练习与测验</a><a href="study.html#notebook" >我的学习</a></nav><span class="night-mark" aria-hidden="true">UNFINISHED</span></header><main class="study-page extras-page" id="extras-main"><div class="section-intro"><a href="assessment.html">练习与测验</a><h1>入门定级</h1><p>不知道从哪里开始？先回答两道关于你的问题，再做 8 道小题，按结果推荐学习路线。大约 5 分钟。</p></div><nav class="extras-nav" aria-label="更多练习"><a href="glossary.html" >术语表</a><a href="chart-practice.html" >读图练习</a><a href="calculators.html" >小计算器</a><a href="placement.html" aria-current="page">入门定级</a></nav><section class="placement" data-placement><script type="application/json" data-placement-data>{"questions":[{"id":"basics-beginner-177-1","stem":"你最在乎“马上成交”，对价格差几分钱不太在意。较适合用哪种单？","options":["限价单","撤单","不下单，等收盘","市价单"],"answer":3,"explanation":"市价单按当时最好价格立即成交，适合优先成交的需求。","stemEn":"You care most about filling right away and not about a few cents. Which order fits better?","optionsEn":["A limit order","A cancellation","No order; wait for the close","A market order"],"explanationEn":"A market order fills immediately at the best price available.","lessons":[{"path":"learn/177-zh.html","title":"Placing Orders: Market vs Limit 下单基础：市价单与限价单"}]},{"id":"basics-beginner-180-1","stem":"有人自称交易所客服，说“为了帮你解冻账户，请提供钱包助记词”。较合理的反应是？","options":["拒绝，并通过官方渠道核实","提供助记词，尽快解冻","只提供前 6 个单词","截图发给对方，避免抄错"],"answer":0,"explanation":"谁有助记词谁就能动用资产；任何索要助记词的人都应视为诈骗。","stemEn":"Someone claiming to be exchange support says “to unfreeze your account, send your recovery phrase.” What is the reasonable response?","optionsEn":["Refuse and verify through official channels","Send it to unfreeze quickly","Send only the first six words","Send a screenshot to avoid typos"],"explanationEn":"Whoever holds the phrase controls the funds; anyone asking for it should be treated as a scam.","lessons":[{"path":"learn/180-zh.html","title":"Wallets & Exchange Custody 钱包与交易所托管"}]},{"id":"indicator-beginner-01","stem":"某资产连续五根已收盘K线的收盘价为10、11、12、13、14。下一根收盘15，仍使用5根收盘价的SMA。新SMA是多少？","options":["12","12.5","13","14"],"answer":2,"explanation":"新窗口是11、12、13、14、15，总和65除以5等于13。","stemEn":"An asset’s last five completed bars closed at 10, 11, 12, 13 and 14. The next bar closes at 15, and you still use a 5-bar SMA of closes. What is the new SMA?","optionsEn":["12","12.5","13","14"],"explanationEn":"The new window is 11, 12, 13, 14 and 15; the sum of 65 divided by 5 is 13.","lessons":[{"path":"learn/1-zh.html","title":"SMA 简单均线"}]},{"id":"method-beginner-01","stem":"某资产多次在99至101间止跌。你把它记为支撑区，下一次价格到100。最合理的学习性判断是什么？","options":["以往止跌次数越多，这次的反弹幅度也应越大","价格一触及100就算止跌确认，不必再看收盘","99至101之间每个价位上的买单数量大致一样","100是以往买卖反应区，这次需观察能否守住"],"answer":3,"explanation":"历史反应使这一区域值得观察，但本次仍须看承接与失守，支撑是可失效的假设。","stemEn":"An asset has repeatedly stopped falling between 99 and 101. You mark it as a support zone, and price comes back to 100. What is the most reasonable learning judgement?","optionsEn":["The more times it held before, the bigger this bounce should be","Touching 100 confirms support; there is no need to watch the close","Buy orders are spread roughly evenly at every price from 99 to 101","100 is an area where buyers and sellers reacted before; watch whether it holds this time"],"explanationEn":"Past reactions make the area worth watching, but this time you still need to see whether it holds or breaks; support is a hypothesis that can fail.","lessons":[{"path":"learn/111-zh.html","title":"支撑与阻力"}]},{"id":"information-beginner-01","stem":"某次核心CPI月环比：前值0.4%，市场一致预期0.2%，实际0.3%，口径一致且没有修正。应怎样描述本次结果？","options":["低于前值，也低于预期","低于前值，但高于预期","高于前值，但低于预期","消费价格比上月下降0.1%"],"answer":1,"explanation":"0.3%低于0.4%，但高于0.2%；“较上月放慢”与“比市场想的热”可以同时成立。","stemEn":"A core CPI month-over-month release: prior 0.4%, consensus 0.2%, actual 0.3%, on the same basis and with no revision. How should the result be described?","optionsEn":["Below the prior reading and below expectations","Below the prior reading, but above expectations","Above the prior reading, but below expectations","Consumer prices fell 0.1% from last month"],"explanationEn":"0.3% is below 0.4% but above 0.2%; \"slowing from last month\" and \"hotter than the market expected\" can both be true.","lessons":[{"path":"info/learn/1-zh.html","title":"CPI 消费者物价指数"},{"path":"info/learn/2-zh.html","title":"核心 CPI"}]},{"id":"crypto-beginner-196-1","stem":"区块链里，每个区块都保存上一个区块的哈希值。这样设计的主要作用是？","options":["让改动历史记录很容易被发现","让每笔交易的确认时间更短","证明写入的信息都是真实的","让别人看不到交易的具体内容"],"answer":0,"explanation":"哈希链把各区块环环相扣，改动任何历史区块都会被其他节点发现。","stemEn":"Each block stores the hash of the previous block. What is the main purpose?","optionsEn":["Make any change to past records easy to detect","Makes each transaction confirm faster","Prove that every recorded statement is true","Hides transaction details from others"],"explanationEn":"Chained hashes link every block, so altering past data is caught by other nodes.","lessons":[{"path":"learn/196-zh.html","title":"Blockchain & the Trilemma 区块链与不可能三角"}]},{"id":"method-advanced-131-1","stem":"突破K收在区间上沿外，下一根是小十字星，再下一根收在突破K的高点之上。最稳妥的读法是？","options":["十字星说明突破已失败","三根都在区间外，所以价格之后不会再回区间","出现十字星，应该转为看空","突破得到跟随，仍需留意收盘是否回到区间"],"answer":3,"explanation":"收盘持续在区间外并创出新高，是跟随；但后续收盘回到区间内时仍要按失效处理。","stemEn":"The breakout bar closes above the range; the next bar is a small doji; the bar after closes above the breakout bar’s high. What is the most reasonable reading?","optionsEn":["The doji shows the breakout has failed","All three bars are outside, so price will not return to the range","Switch to a bearish view because of the doji","The breakout got follow-through; still watch for a close back inside"],"explanationEn":"Closes staying outside and making a new high are follow-through, but a later close back inside would still invalidate it.","lessons":[{"path":"learn/131-zh.html","title":"Breakouts & Failed Breakouts 突破与假突破"}]},{"id":"options-beginner-208-1","stem":"假设某股票现价100美元，一张看涨期权的Delta为0.45。在其他条件不变时，若股价小幅上涨1美元至101美元，该期权理论价格约如何变化？","options":["理论价格约上涨0.45美元","理论价格约下跌0.45美元","理论价格约上涨1.00美元","理论价格约上涨0.55美元"],"answer":0,"explanation":"Delta衡量标的价格每变动1个单位时期权价格的近似变动量；看涨期权Delta为+0.45，标的涨1美元时期权约涨0.45美元。","stemEn":"Suppose a stock trades at $100 and a Call option has a Delta of 0.45. Holding other factors constant, if the stock rises $1 to $101, how will the option's theoretical price change?","optionsEn":["Rise by roughly $0.45","Fall by roughly $0.45","Rise by roughly $1.00","The price rises by about $0.55"],"explanationEn":"Delta measures the approximate change in option price for a $1 move in the underlying; with a +0.45 Call Delta, a $1 stock gain adds about $0.45.","lessons":[{"path":"learn/208-zh.html","title":"Greeks I: Delta & Gamma 希腊字母一：Delta 与 Gamma"}]}],"routes":{"basics":{"name":"小白基础：股票与加密从零开始","description":"还没开户、不知道股票和币是什么时，从这里开始：先弄懂买到的是什么、在哪里买、怎样下单，再认识加密资产、稳定币和杠杆，最后学会保护本金。"},"crypto":{"name":"加密进阶：从一条链到 DeFi","description":"学完小白基础里的币、钱包和稳定币之后，再往下一层：链怎样达成共识、交易所和跨链桥为什么会出事、DeFi 的交易与借贷怎样运作，以及质押收益背后的风险。"},"options":{"name":"期权进阶：希腊字母、波动率与策略","description":"学完小白基础里的期权入门之后，再往下一层：期权价格怎样随标的、时间和波动率变化，隐含波动率高低怎样比较，以及几种常见组合各自放弃了什么。"},"ecosystem":{"name":"生态赛道：Web3 里的主要应用","description":"学完加密进阶之后，认识 Web3 里几类主要应用：链上衍生品、收益聚合与再质押、聚合器与首发平台、集中流动性，以及 GameFi、SocialFi、DAO 和预测市场。每一课都讲它怎样运作、钱从哪里来、常见的失败方式。"},"frontier":{"name":"加密前沿：新叙事在解决什么问题","description":"学完加密进阶之后，再看几条正在发展的方向：现实资产上链、用代币共建基础设施、链上身份、新代币标准、AI 与区块链的结合，以及去中心化科研。每一课都讲它想解决什么、目前卡在哪里。"},"career":{"name":"Web3 入行：看懂行业与岗位","description":"想在 Web3 找工作时，先看懂这个行业由哪些角色组成、日常用什么工具、说什么黑话，再看技术岗和运营商务岗各做什么、需要什么能力、可以准备什么作品。"},"information":{"name":"信息面：从一份数据读起","description":"先学比较口径，再理解传导，最后把多条线索放在一起。按理解推进，不按天数催进度。"},"technical":{"name":"技术面：先会读图，再看信号","description":"先读价格、均价和波动，再加上结构与衍生品数据；不需要一开始背完全部指标。"},"price-action":{"name":"价格行为：一根一根读K线","description":"不加指标，只看K线本身：先量单根，再比相邻两根，最后放回结构和位置里。每一步都要等后续收盘确认。"},"chart-patterns":{"name":"图表形态：先确认，再谈目标","description":"从单根、两根、三根K线的组合，到双顶、头肩和三角形。每个形态先学怎样算完成、怎样算失效，目标位只当参考。"},"discipline":{"name":"交易纪律：先管住亏损，再谈赚钱","description":"不讲新的指标，只讲每一笔交易都绕不开的几件事：错了在哪里认、要不要加码、怎样算总账、心态怎样骗人、成交会花多少成本。"}}}</script><noscript>启用 JavaScript 后可以做入门定级。</noscript></section></main><footer class="market-footer"><span>未尽 UNFINISHED</span><span>理解来自解释，进步来自复盘。</span></footer><script src="assets/placement/placement.js?v=e71e4b1c" defer></script><!-- ai-island:start --><script src="assets/ai/ai-island.js?v=2d4f5c19" defer></script><script src="assets/companion/companion.js?v=46c0ca1d" defer></script><!-- ai-island:end --></body></html>
