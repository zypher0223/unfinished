ue="market"><span><b>信息与技术综合</b><small>四类各抽取 3 题，综合判断</small></span></label><label><input type="radio" name="scope" value="all"><span><b>技术面混合</b><small>三类各抽取 4 题，交错作答</small></span></label></div></fieldset><fieldset><legend>再选难度</legend><div class="test-levels"><label><input type="radio" name="level" value="beginner" checked><span><b>入门</b> · 在具体例子里理解基本概念</span></label><label><input type="radio" name="level" value="advanced"><span><b>进阶</b> · 处理冲突线索、数据限制与确认时点</span></label></div></fieldset><p class="test-description">每次 12 道单选题。题目与选项顺序随机；可返回修改，交卷后逐题查看答案和各选项解释。无倒计时，先想清楚再选。</p><button class="test-primary" type="submit">开始测试</button><p class="test-history" id="test-history"></p></form></section><section id="test-running" hidden aria-label="正在作答"><div class="test-progress"><span id="test-label"></span><span id="answered-count" aria-live="polite"></span></div><nav class="question-map" id="question-map" aria-label="跳转题目"></nav><div id="question-stage"></div><p id="test-message" class="test-message" role="status"></p><div class="test-navigation"><button type="button" id="question-prev">上一题</button><button type="button" id="question-next">下一题</button><button type="button" id="test-submit" class="test-primary">交卷并查看解析</button></div><button type="button" id="test-exit" class="test-secondary">返回测试设置</button></section><section id="test-results" hidden aria-label="测试结果"></section></main><footer class="market-footer"><span>未尽 UNFINISHED</span><span>能说清理由，才算理解。</span></footer><script src="learning-store.js?v=1"></script><script src="questions.js?v=learning-1"></script><script src="assessment.js?v=learning-1"></script><!-- quiz-stats:start --><script src="assets/stats/quiz-stats.js?v=3" defer></script><!-- quiz-stats:end --></body></html>
